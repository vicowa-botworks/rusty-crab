[workspace]
resolver = "2"
members = [
    "conformance",
    "crates/crab-gojson",
    "crates/crab-memory",
    "crates/crab-protocoltypes",
    "crates/crab-tokenizer",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }

[profile.release]
debug = true
